# ============================================================================
# preproc_link.cfg — v++ link config: เพิ่ม preproc_accel เข้าไปใน overlay ที่มี DPU B4096
# ----------------------------------------------------------------------------
# ใช้คู่กับ kria-vitis-platforms  (kv260/overlays/examples/benchmark = DPUCZDX8G B4096
# ตัวเดียวกับ firmware `kv260-benchmark-b4096` ที่ใช้อยู่ตอนนี้ — ห้ามแก้ dpu_conf.vh
# ไม่งั้น fingerprint 0x101000056010407 เปลี่ยน → xmodel เดิมโหลดไม่ได้)
#
#   v++ -l ... --config dpu.cfg --config preproc_link.cfg  dpu.xo preproc_accel.xo
#
# HP port: DPU ของ overlay benchmark ใช้ HPC0 (GP0) + HP0/HP1 (HP0/HP2 ของ IP)
# → preproc_accel ต่อ HP3 เพื่อไม่แย่ง bandwidth กับ DPU  (ตรวจชื่อ SP tag จริงด้วย
#   `platforminfo -p <platform>.xpfm` ก่อน link — ชื่ออาจเป็น HP3 หรือ HP3_1)
# ============================================================================
[connectivity]
nk=preproc_accel:1:preproc_accel_1
sp=preproc_accel_1.m_axi_gmem0:HP3
sp=preproc_accel_1.m_axi_gmem1:HP3
sp=preproc_accel_1.m_axi_gmem2:HP3

[clock]
# 300 MHz = clock id 0 ของ platform kv260 (DPU aclk ก็ 300) — ถ้า timing ไม่ผ่านลด 275/250
freqHz=300000000:preproc_accel_1
